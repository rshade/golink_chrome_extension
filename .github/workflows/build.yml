name: build
on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deps: ${{ github.event_name == 'schedule' && fromJSON('["pinned","latest"]') || fromJSON('["pinned"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - if: matrix.deps == 'latest'
        name: Try latest Tailscale internals
        run: |
          go get tailscale.com@latest
          go mod tidy
      - run: mise run browser-setup
      - name: Install Chromium system libraries
        run: npx playwright-core install-deps chromium
      - name: Allow the install test's private namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run ci
      - name: Test bundle builds
        if: matrix.deps == 'pinned'
        run: mise run test-bundle
