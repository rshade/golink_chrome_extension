[tools]
go = "1.27.3"
node = "26"
"npm:@fission-ai/openspec" = "1.15.0"

[tasks.build]
description = "Build ext/main.wasm and ext/wasm_exec.js"
run = "./build.sh"

[tasks.test-go]
description = "golinkclient tests against a real dev-mode golink"
run = "go test ./..."

[tasks.test-wasm]
description = "js/wasm Go tests (state store and Promise bridge)"
run = 'env -i HOME="$HOME" PATH="$PATH" GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./wasm'

[tasks.test-js]
description = "Extension JavaScript tests with fake Chrome APIs"
run = "node --test"

[tasks.smoke]
description = "Exported Go API of the built WASM, no network"
depends = ["build"]
run = "node scripts/wasm-smoke.cjs"

[tasks.check-deps]
description = "Fail if the WASM build pulls in golink or SQLite"
run = "scripts/check-wasm-deps.sh"

[tasks.browser-setup]
description = "Install Playwright and its Chromium build"
run = ["npm ci", "npx playwright-core install chromium"]

[tasks.test-browser]
description = "Load ext/ into real Chromium and check start-up, WASM node, status page"
depends = ["build"]
run = "node scripts/browser-smoke.cjs"

[tasks.test-e2e]
description = "Drive the extension against a golink on a real tailnet (needs GOLINK_E2E_AUTHKEY)"
depends = ["build"]
run = "node scripts/browser-e2e.cjs"

[tasks.test-e2e-minted]
description = "Mint ephemeral keys from a Tailscale OAuth client, start golink, and run test-e2e (needs TS_OAUTH_CLIENT_ID/SECRET)"
depends = ["build"]
run = "scripts/run-e2e.sh"

[tasks.test-install]
description = "Force-install a signed CRX by policy in Chrome for Testing, then update it (private mount namespace)"
depends = ["build"]
run = "scripts/check-install.sh"

[tasks.test-release]
description = "Force-install the published release into Google Chrome, then run the real-tailnet checks (needs GOLINK_E2E_AUTHKEY)"
run = "scripts/check-release.sh"

[tasks.package]
description = "Build, then pack a signed CRX and zip into dist/release (needs RELEASE_KEY_FILE)"
depends = ["build"]
run = "scripts/package-release.sh"

[tasks.test-bundle]
description = "Write the portable test bundle to dist/ (needs a clean tree)"
run = "scripts/test-bundle.sh"

[tasks.ci]
description = "Everything CI runs, except the test bundle"
depends = ["test-go", "test-wasm", "smoke", "test-js", "check-deps", "test-browser", "test-install"]
